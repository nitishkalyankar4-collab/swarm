[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-quant-agent"
version = "17.0.0"
description = "Institutional-Grade Multi-Agent Quant Hedge Fund Swarm Engine using LangGraph and CCXT"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Hermes Agent / Antigravity", email = "nitishkalyankar4@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "ccxt>=4.0.0",
    "vectorbt>=0.25.0",
    "pandas-ta>=0.3.14b",
    "pandas-datareader>=0.10.0",
    "openbb>=4.0.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "src.connectors*", "src.graph*", "src.execution*"]
